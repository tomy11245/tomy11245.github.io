<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時留言聊天室</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 120px;
      background: #f7f7f8;
    }
    h2 { margin: 8px 0; font-size: 20px; }
    #status { font-size: 13px; color: #666; margin-bottom: 12px; min-height: 18px; }
    #status.ok { color: #1a7f37; }
    #status.err { color: #cf222e; }
    #messages { list-style: none; padding: 0; margin: 0; }
    #messages li {
      background: #fff; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      word-break: break-word;
    }
    #messages li .meta { font-size: 12px; color: #888; margin-bottom: 4px; }
    #messages li .meta .name { color: #0969da; font-weight: 600; }
    #messages li img {
      max-width: 100%; border-radius: 6px; margin-top: 6px; display: block;
    }
    .toolbar {
      display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .toolbar button, .toolbar label {
      padding: 8px 14px; font-size: 14px; border: 1px solid #d0d7de;
      border-radius: 8px; background: #fff; cursor: pointer;
    }
    .toolbar button:disabled, .toolbar label.disabled {
      opacity: 0.5; cursor: not-allowed;
    }
    #preview {
      display: none; margin-bottom: 8px; position: relative;
      background: #fff; padding: 8px; border-radius: 8px;
      border: 1px solid #e5e5e5;
    }
    #preview img { max-width: 100%; max-height: 200px; display: block; border-radius: 6px; }
    #preview .remove {
      position: absolute; top: 4px; right: 4px; background: #cf222e;
      color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px;
      cursor: pointer; font-size: 14px; line-height: 1;
    }
    form {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 8px; padding: 12px;
      background: #fff; border-top: 1px solid #e5e5e5;
    }
    form input {
      flex: 1; padding: 10px 12px; font-size: 16px;
      border: 1px solid #d0d7de; border-radius: 8px; outline: none;
    }
    form input:focus { border-color: #0969da; }
    form button {
      padding: 10px 18px; font-size: 16px; border: none;
      border-radius: 8px; background: #0969da; color: #fff; cursor: pointer;
    }
    form button:disabled { background: #b0b8c1; cursor: not-allowed; }

    /* ===== 截圖選取遮罩層 ===== */
    #captureOverlay {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.85);
      cursor: crosshair;
      user-select: none;
    }
    #captureOverlay.active { display: block; }
    #captureCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain;
    }
    #selectionBox {
      position: absolute;
      border: 2px dashed #00e0ff;
      background: rgba(0,224,255,0.12);
      pointer-events: none;
      display: none;
    }
    #captureHint {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px;
      border-radius: 8px; font-size: 14px; pointer-events: none;
    }
    #captureCancel {
      position: absolute; top: 16px; right: 16px;
      padding: 6px 14px; background: #cf222e; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>即時留言聊天室</h2>
  <div id="status">連線中…</div>

  <div class="toolbar">
    <label id="uploadLabel">
      上傳圖片
      <input type="file" id="fileInput" accept="image/*" style="display:none" />
    </label>
    <button id="captureBtn" type="button">截取畫面範圍</button>
  </div>

  <div id="preview">
    <img id="previewImg" alt="預覽" />
    <button class="remove" id="removePreview" type="button">×</button>
  </div>

  <ul id="messages"></ul>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="輸入留言，按 Enter 送出" />
    <button id="send" disabled>送出</button>
  </form>

  <!-- 截圖遮罩層 -->
  <div id="captureOverlay">
    <canvas id="captureCanvas"></canvas>
    <div id="selectionBox"></div>
    <div id="captureHint">按住滑鼠拖曳，框選要截取的範圍</div>
    <button id="captureCancel" type="button">取消</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://chatroom-415a9-default-rtdb.firebaseio.com"
    };

    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const fileInput = document.getElementById('fileInput');
    const uploadLabel = document.getElementById('uploadLabel');
    const captureBtn = document.getElementById('captureBtn');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');
    const removePreview = document.getElementById('removePreview');

    const overlay = document.getElementById('captureOverlay');
    const captureCanvas = document.getElementById('captureCanvas');
    const selectionBox = document.getElementById('selectionBox');
    const captureCancel = document.getElementById('captureCancel');

    let pendingImage = null;
    let messagesRef = null;

    // 截圖狀態
    let fullImage = null;        // 目前抓到的完整畫面（Image 物件）
    let sourceImageData = null;  // 用來裁切的原始 canvas
    let isDragging = false;
    let startX = 0, startY = 0;

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }

    function compressImage(fileOrBlob, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(fileOrBlob);
      });
    }

    function showPreview(base64) {
      pendingImage = base64;
      previewImg.src = base64;
      preview.style.display = 'block';
    }

    function clearPreview() {
      pendingImage = null;
      previewImg.src = '';
      preview.style.display = 'none';
      fileInput.value = '';
    }

    removePreview.addEventListener('click', clearPreview);

    // 上傳本地圖片
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      try {
        const base64 = await compressImage(file);
        showPreview(base64);
      } catch (e) {
        console.error('圖片處理失敗:', e);
        setStatus('圖片處理失敗', 'err');
      }
    });

    // ===== 截取自訂範圍 =====
    function resetCaptureState() {
      overlay.classList.remove('active');
      selectionBox.style.display = 'none';
      isDragging = false;
      fullImage = null;
      sourceImageData = null;
    }

    captureCancel.addEventListener('click', resetCaptureState);

    captureBtn.addEventListener('click', async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        setStatus('此瀏覽器不支援螢幕擷取', 'err');
        return;
      }
      let stream = null;
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const track = stream.getVideoTracks()[0];
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        await new Promise(r => setTimeout(r, 200));

        // 把整張畫面畫到離屏 canvas
        const off = document.createElement('canvas');
        off.width = video.videoWidth;
        off.height = video.videoHeight;
        off.getContext('2d').drawImage(video, 0, 0);
        sourceImageData = off;

        // 顯示到遮罩上的 canvas
        fullImage = new Image();
        fullImage.onload = () => {
          captureCanvas.width = fullImage.width;
          captureCanvas.height = fullImage.height;
          captureCanvas.getContext('2d').drawImage(fullImage, 0, 0);
          overlay.classList.add('active');
        };
        fullImage.src = off.toDataURL('image/png');
      } catch (e) {
        console.error('截圖失敗:', e);
        if (e.name !== 'NotAllowedError') setStatus('截圖失敗：' + e.message, 'err');
      } finally {
        if (stream) stream.getTracks().forEach(t => t.stop());
      }
    });

    // 讓 canvas 依容器大小等比例縮放，取得實際顯示座標
    function getCanvasRect() {
      return captureCanvas.getBoundingClientRect();
    }

    // 把滑鼠座標換算成原始圖片的像素座標
    function toImageCoords(clientX, clientY) {
      const rect = getCanvasRect();
      const scaleX = captureCanvas.width / rect.width;
      const scaleY = captureCanvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    overlay.addEventListener('mousedown', (e) => {
      if (e.target === captureCancel) return;
      const rect = getCanvasRect();
      // 點在圖片顯示區外就不開始
      if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;

      isDragging = true;
      const p = toImageCoords(e.clientX, e.clientY);
      startX = p.x;
      startY = p.y;

      selectionBox.style.display = 'block';
      selectionBox.style.left = (e.clientX - rect.left) + 'px';
      selectionBox.style.top = (e.clientY - rect.top) + 'px';
      selectionBox.style.width = '0px';
      selectionBox.style.height = '0px';
    });

    overlay.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = getCanvasRect();
      const p = toImageCoords(e.clientX, e.clientY);
      const displayX = Math.min(e.clientX, rect.left + (startX / (captureCanvas.width / rect.width)));
      const displayY = Math.min(e.clientY, rect.top + (startY / (captureCanvas.height / rect.height)));

      const x = Math.min(p.x, startX);
      const y = Math.min(p.y, startY);
      const w = Math.abs(p.x - startX);
      const h = Math.abs(p.y - startY);

      // 以顯示座標畫框，範圍限制在圖片區內
      const left = Math.max(rect.left, Math.min(e.clientX, rect.left + rect.width));
      const top = Math.max(rect.top, Math.min(e.clientY, rect.top + rect.height));
      const startDisplayX = rect.left + (startX / (captureCanvas.width / rect.width));
      const startDisplayY = rect.top + (startY / (captureCanvas.height / rect.height));

      selectionBox.style.left = Math.min(left, startDisplayX) + 'px';
      selectionBox.style.top = Math.min(top, startDisplayY) + 'px';
      selectionBox.style.width = Math.abs(left - startDisplayX) + 'px';
      selectionBox.style.height = Math.abs(top - startDisplayY) + 'px';
    });

    overlay.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;

      const p = toImageCoords(e.clientX, e.clientY);
      const x = Math.min(p.x, startX);
      const y = Math.min(p.y, startY);
      const w = Math.abs(p.x - startX);
      const h = Math.abs(p.y - startY);

      if (w < 5 || h < 5) {
        // 太小視為誤點，取消
        resetCaptureState();
        return;
      }

      // 從原始畫面裁切
      const crop = document.createElement('canvas');
      crop.width = w;
      crop.height = h;
      crop.getContext('2d').drawImage(sourceImageData, x, y, w, h, 0, 0, w, h);

      const base64 = crop.toDataURL('image/jpeg', 0.7);
      showPreview(base64);
      resetCaptureState();
    });

    // ===== Firebase =====
    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      messagesRef = db.ref('messages');

      messagesRef.on('value', (snapshot) => {
        const data = snapshot.val();
        messagesEl.innerHTML = '';

        if (data) {
          Object.entries(data).forEach(([id, msg]) => {
            const li = document.createElement('li');
            const meta = document.createElement('div');
            meta.className = 'meta';

            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = '匿名';

            const time = document.createElement('span');
            time.textContent = ' · ' + new Date(msg.time || Date.now()).toLocaleTimeString();

            meta.appendChild(name);
            meta.appendChild(time);
            li.appendChild(meta);

            if (msg.text) {
              const body = document.createElement('div');
              body.textContent = msg.text;
              li.appendChild(body);
            }

            if (msg.image) {
              const img = document.createElement('img');
              img.src = msg.image;
              img.alt = '留言圖片';
              li.appendChild(img);
            }

            messagesEl.appendChild(li);
          });
        }

        window.scrollTo(0, document.body.scrollHeight);
        setStatus('已連線 · 即時同步中', 'ok');
        sendBtn.disabled = false;
        uploadLabel.classList.remove('disabled');
        captureBtn.disabled = false;
      }, (error) => {
        console.error('監聽失敗:', error);
        setStatus('讀取失敗：' + error.message, 'err');
        sendBtn.disabled = true;
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text && !pendingImage) return;

        const payload = { name: '匿名', time: Date.now() };
        if (text) payload.text = text.slice(0, 500);
        if (pendingImage) payload.image = pendingImage;

        input.value = '';
        const imageToSend = pendingImage;
        clearPreview();

        messagesRef.push(payload).catch((err) => {
          console.error('送出失敗:', err);
          setStatus('送出失敗：' + err.message, 'err');
          input.value = text;
          if (imageToSend) showPreview(imageToSend);
        });
      });

    } catch (err) {
      console.error('Firebase 初始化失敗:', err);
      setStatus('Firebase 設定有誤，請檢查 Console', 'err');
      sendBtn.disabled = true;
    }
  </script>
</body>
</html>
