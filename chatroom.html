<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時留言聊天室</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 120px;
      background: #f7f7f8;
    }
    h2 { margin: 8px 0; font-size: 20px; }
    #status { font-size: 13px; color: #666; margin-bottom: 12px; min-height: 18px; }
    #status.ok { color: #1a7f37; }
    #status.err { color: #cf222e; }
    #messages { list-style: none; padding: 0; margin: 0; }
    #messages li {
      background: #fff; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      word-break: break-word;
    }
    #messages li .meta { font-size: 12px; color: #888; margin-bottom: 4px; }
    #messages li .meta .name { color: #0969da; font-weight: 600; }
    #messages li img {
      max-width: 100%; border-radius: 6px; margin-top: 6px; display: block;
    }
    /* 檔案下載樣式 */
    .file-attachment {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 8px; padding: 8px 12px;
      background: #f0f7ff; border: 1px solid #cce5ff;
      border-radius: 6px; color: #0969da; text-decoration: none;
      font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .file-attachment:hover { background: #e0efff; }
    
    .toolbar {
      display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .toolbar button, .toolbar label {
      padding: 8px 14px; font-size: 14px; border: 1px solid #d0d7de;
      border-radius: 8px; background: #fff; cursor: pointer;
    }
    .toolbar button:disabled, .toolbar label.disabled {
      opacity: 0.5; cursor: not-allowed;
    }
    #preview {
      display: none; margin-bottom: 8px; position: relative;
      background: #fff; padding: 8px; border-radius: 8px;
      border: 1px solid #e5e5e5;
    }
    #preview img { max-width: 100%; max-height: 200px; display: block; border-radius: 6px; }
    #preview .remove {
      position: absolute; top: 4px; right: 4px; background: #cf222e;
      color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px;
      cursor: pointer; font-size: 14px; line-height: 1;
    }
    form {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 8px; padding: 12px;
      background: #fff; border-top: 1px solid #e5e5e5;
    }
    form input {
      flex: 1; padding: 10px 12px; font-size: 16px;
      border: 1px solid #d0d7de; border-radius: 8px; outline: none;
    }
    form input:focus { border-color: #0969da; }
    form button {
      padding: 10px 18px; font-size: 16px; border: none;
      border-radius: 8px; background: #0969da; color: #fff; cursor: pointer;
    }
    form button:disabled { background: #b0b8c1; cursor: not-allowed; }

    #versionBadge {
      position: fixed; top: 12px; right: 12px; z-index: 10000;
      font-size: 12px; color: #666; background: rgba(255,255,255,0.9);
      border: 1px solid #e5e5e5; border-radius: 999px;
      padding: 4px 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* 截圖遮罩 CSS */
    #captureOverlay { display: none; position: fixed; inset: 0; z-index: 9999; background: #000; cursor: crosshair; user-select: none; overflow: hidden; }
    #captureOverlay.active { display: block; }
    #captureCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
    #selectionBox { position: absolute; border: 2px dashed #00e0ff; background: rgba(0,224,255,0.12); pointer-events: none; display: none; }
    #captureHint { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; pointer-events: none; }
    #captureCancel { position: absolute; top: 16px; right: 16px; padding: 6px 14px; background: #cf222e; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    body.capture-mode { overflow: hidden; }
  </style>
</head>
<body>
  <div id="versionBadge">v1.2.0</div>

  <h2>即時留言聊天室</h2>
  <div id="status">連線中…</div>

  <div class="toolbar">
    <label id="uploadLabel">
      上傳圖片
      <input type="file" id="fileInput" accept="image/*" style="display:none" />
    </label>
    <button id="captureBtn" type="button">截取畫面</button>
    <label id="docLabel">
      上傳文件
      <input type="file" id="docInput" style="display:none" />
    </label>
  </div>

  <div id="preview">
    <img id="previewImg" alt="預覽" />
    <button class="remove" id="removePreview" type="button">×</button>
  </div>

  <ul id="messages"></ul>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="輸入留言，按 Enter 送出" />
    <button id="send" disabled>送出</button>
  </form>

  <div id="captureOverlay">
    <canvas id="captureCanvas"></canvas>
    <div id="selectionBox"></div>
    <div id="captureHint">按住滑鼠拖曳，框選要截取的範圍</div>
    <button id="captureCancel" type="button">取消</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script>
    const APP_VERSION = "v1.2.0";
    document.getElementById('versionBadge').textContent = APP_VERSION;

    // 這裡填入你的 Worker 網址
    const WORKER_URL = "https://r2-worker.keybe11245.workers.dev";

    const firebaseConfig = {
      databaseURL: "https://chatroom-415a9-default-rtdb.firebaseio.com"
    };

    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const fileInput = document.getElementById('fileInput');
    const docInput = document.getElementById('docInput');
    const captureBtn = document.getElementById('captureBtn');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('previewImg');
    const removePreview = document.getElementById('removePreview');

    const overlay = document.getElementById('captureOverlay');
    const captureCanvas = document.getElementById('captureCanvas');
    const selectionBox = document.getElementById('selectionBox');
    const captureCancel = document.getElementById('captureCancel');

    let pendingImage = null;
    let messagesRef = null;

    // 截圖變數
    let sourceImage = null; 
    let renderRect = { x: 0, y: 0, w: 0, h: 0 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }

    function compressImage(fileOrBlob, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(fileOrBlob);
      });
    }

    function showPreview(base64) {
      pendingImage = base64;
      previewImg.src = base64;
      preview.style.display = 'block';
    }

    function clearPreview() {
      pendingImage = null;
      previewImg.src = '';
      preview.style.display = 'none';
      fileInput.value = '';
      docInput.value = '';
    }

    removePreview.addEventListener('click', clearPreview);

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      try {
        const base64 = await compressImage(file);
        showPreview(base64);
      } catch (e) {
        console.error('圖片處理失敗:', e);
        setStatus('圖片處理失敗', 'err');
      }
    });

    // 上傳文件處理
    docInput.addEventListener('change', async () => {
      const file = docInput.files[0];
      if (!file) return;
      
      const text = input.value.trim();
      input.value = '';

      setStatus('文件上傳中，請稍候…', '');
      
      try {
        // 1. 跟 Worker 請求上傳網址
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fileName: file.name, fileType: file.type })
        });
        
        if (!res.ok) throw new Error('無法取得上傳授權');
        const { uploadUrl, key } = await res.json();

        // 2. 直接把檔案傳給 Worker，讓 Worker 幫我們傳到 R2
        const formData = new FormData();
        formData.append('file', file);
        formData.append('uploadUrl', uploadUrl);

        const uploadRes = await fetch(WORKER_URL + "/upload", {
          method: 'POST',
          body: formData
        });
        
        if (!uploadRes.ok) throw new Error('上傳至 R2 失敗，請檢查 Worker');

        // 3. 將資料寫入 Firebase
        const payload = { name: '匿名', time: Date.now(), fileKey: key, fileName: file.name };
        if (text) payload.text = text.slice(0, 500);
        
        await messagesRef.push(payload);
        
        setStatus('已連線 · 即時同步中', 'ok');
        docInput.value = '';
      } catch (err) {
        console.error('文件上傳失敗:', err);
        setStatus('文件上傳失敗：' + err.message, 'err');
      }
    });

    // ===== 截圖功能 =====
    function resetCaptureState() {
      overlay.classList.remove('active');
      document.body.classList.remove('capture-mode');
      selectionBox.style.display = 'none';
      isDragging = false;
      sourceImage = null;
    }

    captureCancel.addEventListener('click', resetCaptureState);

    async function captureFullScreen() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        setStatus('此瀏覽器不支援螢幕擷取', 'err');
        return;
      }
      let stream = null;
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const track = stream.getVideoTracks()[0];
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();
        await new Promise(r => setTimeout(r, 200));

        const off = document.createElement('canvas');
        off.width = video.videoWidth;
        off.height = video.videoHeight;
        off.getContext('2d').drawImage(video, 0, 0);
        
        sourceImage = new Image();
        sourceImage.src = off.toDataURL('image/png');
        
        sourceImage.onload = () => {
          document.body.classList.add('capture-mode');
          overlay.classList.add('active');
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              drawCanvasToFit();
            });
          });
        };
      } catch (e) {
        console.error('截圖失敗:', e);
        if (e.name !== 'NotAllowedError') setStatus('截圖失敗：' + e.message, 'err');
      } finally {
        if (stream) stream.getTracks().forEach(t => t.stop());
      }
    }

    function drawCanvasToFit() {
      const dpr = window.devicePixelRatio || 1;
      const viewW = overlay.clientWidth;
      const viewH = overlay.clientHeight;
      
      captureCanvas.width = viewW * dpr;
      captureCanvas.height = viewH * dpr;
      
      const ctx = captureCanvas.getContext('2d');
      ctx.scale(dpr, dpr);
      
      const imgW = sourceImage.width;
      const imgH = sourceImage.height;
      const scale = Math.min(viewW / imgW, viewH / imgH);
      
      const drawW = imgW * scale;
      const drawH = imgH * scale;
      const drawX = (viewW - drawW) / 2;
      const drawY = (viewH - drawH) / 2;
      
      renderRect = { x: drawX, y: drawY, w: drawW, h: drawH };
      
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, viewW, viewH);
      ctx.drawImage(sourceImage, drawX, drawY, drawW, drawH);
    }

    captureBtn.addEventListener('click', captureFullScreen);

    function clampCoords(x, y) {
      return {
        x: Math.max(renderRect.x, Math.min(x, renderRect.x + renderRect.w)),
        y: Math.max(renderRect.y, Math.min(y, renderRect.y + renderRect.h))
      };
    }

    overlay.addEventListener('mousedown', (e) => {
      if (e.target === captureCancel) return;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      if (mouseX < renderRect.x || mouseX > renderRect.x + renderRect.w ||
          mouseY < renderRect.y || mouseY > renderRect.y + renderRect.h) {
        return;
      }

      isDragging = true;
      dragStart = { x: mouseX, y: mouseY };

      selectionBox.style.display = 'block';
      selectionBox.style.left = mouseX + 'px';
      selectionBox.style.top = mouseY + 'px';
      selectionBox.style.width = '0px';
      selectionBox.style.height = '0px';
    });

    overlay.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const cur = clampCoords(e.clientX, e.clientY);
      const left = Math.min(dragStart.x, cur.x);
      const top = Math.min(dragStart.y, cur.y);
      const width = Math.abs(cur.x - dragStart.x);
      const height = Math.abs(cur.y - dragStart.y);

      selectionBox.style.left = left + 'px';
      selectionBox.style.top = top + 'px';
      selectionBox.style.width = width + 'px';
      selectionBox.style.height = height + 'px';
    });

    overlay.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const cur = clampCoords(e.clientX, e.clientY);
      const left = Math.min(dragStart.x, cur.x);
      const top = Math.min(dragStart.y, cur.y);
      const width = Math.abs(cur.x - dragStart.x);
      const height = Math.abs(cur.y - dragStart.y);

      if (width < 5 || height < 5) {
        resetCaptureState();
        return;
      }

      const relX = (left - renderRect.x) / renderRect.w;
      const relY = (top - renderRect.y) / renderRect.h;
      const relW = width / renderRect.w;
      const relH = height / renderRect.h;

      const realX = relX * sourceImage.width;
      const realY = relY * sourceImage.height;
      const realW = relW * sourceImage.width;
      const realH = relH * sourceImage.height;

      const crop = document.createElement('canvas');
      crop.width = Math.round(realW);
      crop.height = Math.round(realH);
      crop.getContext('2d').drawImage(
        sourceImage, 
        realX, realY, realW, realH,
        0, 0, crop.width, crop.height
      );

      const base64 = crop.toDataURL('image/jpeg', 0.8);
      showPreview(base64);
      resetCaptureState();
    });

    window.addEventListener('resize', () => {
      if (overlay.classList.contains('active') && sourceImage) {
        drawCanvasToFit();
      }
    });

    // ===== 點擊下載檔案 =====
    async function downloadFile(key, originalName) {
      setStatus('正在準備下載…', '');
      try {
        // 1. 向 Worker 請求臨時下載網址
        const res = await fetch(WORKER_URL + "/download", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: key })
        });

        if (!res.ok) throw new Error('取得下載網址失敗');
        const { downloadUrl } = await res.json();

        // 2. 用 fetch 把檔案抓下來，轉成 Blob
        const fileRes = await fetch(downloadUrl);
        if (!fileRes.ok) throw new Error('檔案下載失敗');
        const blob = await fileRes.blob();
        
        // 3. 把 Blob 轉成瀏覽器本地網址並強制下載
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = originalName; // 強制使用原始檔名下載
        document.body.appendChild(a);
        a.click();
        
        // 清理記憶體
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);

        setStatus('已連線 · 即時同步中', 'ok');
      } catch (e) {
        console.error('下載失敗:', e);
        setStatus('下載失敗', 'err');
        alert('下載失敗：' + e.message);
      }
    }

    // ===== Firebase 初始化與渲染 =====
    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      messagesRef = db.ref('messages');

      messagesRef.on('value', (snapshot) => {
        const data = snapshot.val();
        messagesEl.innerHTML = '';

        if (data) {
          Object.entries(data).forEach(([id, msg]) => {
            const li = document.createElement('li');
            const meta = document.createElement('div');
            meta.className = 'meta';

            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = '匿名';

            const time = document.createElement('span');
            time.textContent = ' · ' + new Date(msg.time || Date.now()).toLocaleTimeString();

            meta.appendChild(name);
            meta.appendChild(time);
            li.appendChild(meta);

            if (msg.text) {
              const body = document.createElement('div');
              body.textContent = msg.text;
              li.appendChild(body);
            }

            if (msg.image) {
              const img = document.createElement('img');
              img.src = msg.image;
              img.alt = '留言圖片';
              li.appendChild(img);
            }

            // 顯示 R2 檔案連結
            if (msg.fileKey) {
              const a = document.createElement('a');
              a.className = 'file-attachment';
              a.innerHTML = `📄 ${msg.fileName || '下載檔案'}`;
              a.onclick = () => downloadFile(msg.fileKey, msg.fileName);
              li.appendChild(a);
            }

            messagesEl.appendChild(li);
          });
        }

        window.scrollTo(0, document.body.scrollHeight);
        setStatus('已連線 · 即時同步中', 'ok');
        sendBtn.disabled = false;
        document.getElementById('uploadLabel').classList.remove('disabled');
        document.getElementById('docLabel').classList.remove('disabled');
        captureBtn.disabled = false;
      }, (error) => {
        console.error('監聽失敗:', error);
        setStatus('讀取失敗：' + error.message, 'err');
        sendBtn.disabled = true;
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text && !pendingImage) return;

        const payload = { name: '匿名', time: Date.now() };
        if (text) payload.text = text.slice(0, 500);
        if (pendingImage) payload.image = pendingImage;

        input.value = '';
        const imageToSend = pendingImage;
        clearPreview();

        messagesRef.push(payload).catch((err) => {
          console.error('送出失敗:', err);
          setStatus('送出失敗：' + err.message, 'err');
          input.value = text;
          if (imageToSend) showPreview(imageToSend);
        });
      });

    } catch (err) {
      console.error('Firebase 初始化失敗:', err);
      setStatus('Firebase 設定有誤，請檢查 Console', 'err');
      sendBtn.disabled = true;
    }
  </script>
</body>
</html>
