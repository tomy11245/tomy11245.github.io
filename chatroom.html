<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時留言聊天室</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 90px;
      background: #f7f7f8;
    }
    h2 { margin: 8px 0; font-size: 20px; }
    #status { font-size: 13px; color: #666; margin-bottom: 12px; min-height: 18px; }
    #status.ok { color: #1a7f37; }
    #status.err { color: #cf222e; }
    #messages { list-style: none; padding: 0; margin: 0; }
    #messages li {
      background: #fff; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      word-break: break-word;
    }
    #messages li .meta { font-size: 12px; color: #888; margin-bottom: 4px; }
    #messages li .meta .name { color: #0969da; font-weight: 600; }
    form {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 8px; padding: 12px;
      background: #fff; border-top: 1px solid #e5e5e5;
    }
    form input {
      flex: 1; padding: 10px 12px; font-size: 16px;
      border: 1px solid #d0d7de; border-radius: 8px; outline: none;
    }
    form input:focus { border-color: #0969da; }
    form button {
      padding: 10px 18px; font-size: 16px; border: none;
      border-radius: 8px; background: #0969da; color: #fff; cursor: pointer;
    }
    form button:disabled { background: #b0b8c1; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>即時留言聊天室</h2>
  <div id="status">連線中…</div>
  <ul id="messages"></ul>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="輸入留言，按 Enter 送出" />
    <button id="send" disabled>送出</button>
  </form>

  <!-- Firebase Realtime Database SDK（CDN） -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script>
    // ===== 你的 Realtime Database 設定 =====
    const firebaseConfig = {
      databaseURL: "https://chatroom-415a9-default-rtdb.firebaseio.com"
    };

    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || '';
    }

    try {
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const messagesRef = db.ref('messages');

      // 即時監聽，資料一變就重新渲染
      messagesRef.on('value', (snapshot) => {
        const data = snapshot.val();
        messagesEl.innerHTML = '';

        if (data) {
          Object.entries(data).forEach(([id, msg]) => {
            const li = document.createElement('li');

            const meta = document.createElement('div');
            meta.className = 'meta';

            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = '匿名';

            const time = document.createElement('span');
            time.textContent = ' · ' + new Date(msg.time || Date.now()).toLocaleTimeString();

            meta.appendChild(name);
            meta.appendChild(time);

            const body = document.createElement('div');
            body.textContent = msg.text || '';

            li.appendChild(meta);
            li.appendChild(body);
            messagesEl.appendChild(li);
          });
        }

        window.scrollTo(0, document.body.scrollHeight);
        setStatus('已連線 · 即時同步中', 'ok');
        sendBtn.disabled = false;
      }, (error) => {
        console.error('監聽失敗:', error);
        setStatus('讀取失敗：' + error.message, 'err');
        sendBtn.disabled = true;
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        input.value = '';

        messagesRef.push({
          text: text.slice(0, 500),
          name: '匿名',
          time: Date.now()
        }).catch((err) => {
          console.error('送出失敗:', err);
          setStatus('送出失敗：' + err.message, 'err');
          input.value = text;
        });
      });

    } catch (err) {
      console.error('Firebase 初始化失敗:', err);
      setStatus('Firebase 設定有誤，請檢查 Console', 'err');
      sendBtn.disabled = true;
    }
  </script>
</body>
</html>
