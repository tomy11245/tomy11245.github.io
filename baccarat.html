          '% / 和 ' + (BASELINE.tie*100).toFixed(2) +
          '%<br>依剩餘牌精確計算　·　對子基準 ' + (pairBase*100).toFixed(2) +
          '%（' + m.decks + ' 副）</div>';
  // 每注期望值：押 1 注長期平均賺賠（莊扣 5%、和 8 倍、對子 11 倍）
  const ev = betEVs(r, pairP);
  html += '<div class="ev-row">每注期望值　' + [['B', '莊'], ['P', '閒'], ['T', '和'], ['BP', '對子']].map(([k, lb]) =>
    lb + ' <b class="' + (ev[k] > 0 ? 'pos' : 'neg') + '">' + (ev[k] > 0 ? '+' : '') + (ev[k] * 100).toFixed(2) + '%</b>').join('　') + '</div>';
  const jt = pairJoint(rankCounts(m, m.hands.length));
  if(jt){
    const tri = tripleEV(r, pairP, jt);
    html += '<div class="ev-row">三注齊押（和＋莊對＋閒對，含加送 ' + fmtMoney(bonusUnits()).replace('+', '') + '）合計期望 <b class="' + (tri > 0 ? 'pos' : 'neg') + '">' +
      (tri > 0 ? '+' : '') + tri.toFixed(3) + ' 注（' + fmtMoney(tri) + '）</b>　三寶齊開機率 ' + (jt.tieBoth * 100).toFixed(3) + '%</div>';
  }
  el.innerHTML = html;
}

/* ========== 策略走勢 ==========
   每一手只用「那一手之前」的資料做預測，再和實際結果比對（和局不計）。
   信心率：各策略自己的訊號強度（定義見 rule），不是保證勝率。 */
const BANKER_SHARE = BASELINE.banker / (BASELINE.banker + BASELINE.player) * 100;
/* 問路票數：假設下一手開莊／開閒時，下三路各出現幾個紅、幾個藍
   （同一條路開莊與開閒的顏色必定相反，所以莊的紅＝閒的藍） */
/* 單一條下三路：押「問路會出該顏色」的一方
   信心率＝本靴這條路目前出該顏色的比例（加一平滑，資料少時接近 50%） */
function singleRoadStrategies(){
  const roads = [['眼', '大眼仔', 1, 0], ['小', '小路', 2, 1], ['蟑', '蟑螂路', 3, 2]];
  const out = [];
  for(const [s1, name, offset, k] of roads){
    for(const [color, cname] of [['red', '紅'], ['blue', '藍']]){
      out.push({
        id: 'road' + offset + color, name: name + '（' + cname + '）', short: s1 + cname,
        rule: '只看' + name + '，押問路會出' + cname + '的一方。信心率＝本靴' + name + '出' + cname + '的比例',
        predict: ctx => {
          const ask = askRoad(ctx.results, 'B')[k];        // 開莊時這條路的顏色；開閒必為相反色
          if(!ask) return null;
          const marks = derivedMarkers(buildBigRoad(ctx.results), offset);
          const same = marks.filter(c => c === color).length;
          return { side: ask === color ? 'B' : 'P', conf: (same + 1) / (marks.length + 2) * 100 };
        }
      });
    }
  }
  return out;
}
/* ========== 和局／對子 ==========
   只押「機率高於賠率損益兩平點」的時候；沒押的手仍畫出信心率（＝預估機率）。
   和局 8 倍：損益兩平 1/9 ≈ 11.11%；對子 11 倍：損益兩平 1/12 ≈ 8.33% */
const SIDE_BETS = [
  { kind: 'T',  label: '和局', short: '和',   pays: 8,  base: BASELINE.tie,       ev: h => getWinner(h.player, h.banker) === 'T' },
  { kind: 'BP', label: '莊對', short: '莊對', pays: 11, base: 31 / 415,           ev: h => isPair(h.banker) },
  { kind: 'PP', label: '閒對', short: '閒對', pays: 11, base: 31 / 415,           ev: h => isPair(h.player) }
];
function rankCounts(machine, upTo){
  const c = {};
  for(const r of RANKS) c[r] = machine.decks * 4;
  for(const h of machine.hands.slice(0, upTo)) for(const card of [...h.player, ...h.banker]){
    if(c[card.rank] > 0) c[card.rank]--;
  }
  return c;
}
function pairProbFromCounts(c){
  let N = 0, sum = 0;
  for(const r in c){ N += c[r]; sum += c[r] * (c[r] - 1); }
  return N < 2 ? null : sum / (N * (N - 1));
}
/* 「距離上次出現隔了幾手」分組：0-4、5-9、10-14、15-19、20+ */
const gapBucket = g => Math.min(4, Math.floor(g / 5));
function gapTally(seqs, ev){
  const n = [0,0,0,0,0], e = [0,0,0,0,0];
  for(const hands of seqs){
    let gap = 0;
    for(const h of hands){
      const b = gapBucket(gap);
      n[b]++;
      if(ev(h)){ e[b]++; gap = 0; } else gap++;
    }
  }
  return { n, e };
}
function sideBetStrategies(){
  const out = [];
  for(const sb of SIDE_BETS){
    const be = 1 / (sb.pays + 1) * 100;
    out.push({
      id: sb.kind + 'count', name: sb.label + '・算牌', short: sb.short + '算', ref: be, ymax: 30,
      rule: '依剩餘牌精確計算' + sb.label + '機率，高於損益兩平 ' + be.toFixed(2) + '%（賠 ' + sb.pays + ' 倍）才押。信心率＝' + sb.label + '機率',
      predict: ctx => {
        let pr;
        if(sb.kind === 'T'){ const o = exactOdds(ctx.counts); pr = o ? o.tie : null; }
        else pr = pairProbFromCounts(ctx.rcounts);
        if(pr == null) return null;
        return { side: pr * 100 > be ? sb.kind : null, conf: pr * 100 };
      }
    });
    out.push({
      id: sb.kind + 'gap', name: sb.label + '・歷史間隔', short: sb.short + '史', ref: be, ymax: 30,
      rule: '用以往牌靴（其他機台全部＋本機台這手之前）統計「隔了幾手沒開」之後開' + sb.label + '的比例，高於損益兩平才押。信心率＝該比例',
      predict: ctx => {
        // 其他機台的統計每次回測只算一次
        const key = 'gap' + sb.kind;
        if(!ctx.shared[key]) ctx.shared[key] = gapTally(ctx.others, sb.ev);
        const past = ctx.shared[key];
        const mine = gapTally([ctx.machine.hands.slice(0, ctx.i)], sb.ev);
        let gap = 0;
        for(let j = ctx.i - 1; j >= 0 && !sb.ev(ctx.machine.hands[j]); j--) gap++;
        const b = gapBucket(gap);
        const n = past.n[b] + mine.n[b], e = past.e[b] + mine.e[b];
        const alpha = 30;                                  // 資料少時往理論機率靠攏
        const pr = (e + alpha * sb.base) / (n + alpha) * 100;
        return { side: pr > be ? sb.kind : null, conf: pr };
      }
    });
  }
  return out;
}

function askVotes(results){
  const ask = askRoad(results, 'B');
  const avail = ask.filter(Boolean).length;
  if(!avail) return null;
  const redB = ask.filter(c => c === 'red').length;
  const blueB = avail - redB;
  return { avail, redB, blueB, redP: blueB, blueP: redB };
}
/* ========== 策略分類 ========== */
const STRAT_CATS = [
  { id: 'meta',  label: '綜合' },
  { id: 'basic', label: '莊閒基本' },
  { id: 'roads', label: '下三路' },
  { id: 'tie',   label: '和局' },
  { id: 'pair',  label: '對子' },
  { id: 'ev',    label: '期望值' },
  { id: 'combo', label: '和＋對子' }
];
function catOf(id){
  if(id.indexOf('meta') === 0) return 'meta';
  if(id === 'banker' || id === 'follow' || id === 'count') return 'basic';
  if(id.indexOf('road') === 0) return 'roads';
  if(id.indexOf('T') === 0) return 'tie';
  if(id === 'ev') return 'ev';
  if(id === 'triple' || id === 'tieBoth' || id === 'bothPair') return 'combo';
  return 'pair';                                     // BPcount、BPgap、PPcount、PPgap
}

/* ========== 綜合策略 ==========
   參考其他「押莊閒」策略到這一手之前的成績（不偷看當手結果）。
   平滑成功率＝(押中＋1) ÷ (下注＋2)，資料少時接近 50% */
const smoothRate = sr => (sr.hits + 1) / (sr.bets + 2);
const isBPSide = pr => pr && (pr.side === 'B' || pr.side === 'P');
const META_STRATEGIES = [
  {
    id: 'metaVote', name: '綜合加權', short: '綜',
    rule: '所有莊閒策略依過去成功率加權投票：高於 50% 投正票、低於 50% 投反票，押分數高的一方。信心率＝分數差換算的把握度',
    meta: (preds, series) => {
      let sB = 0, sP = 0, total = 0;
      preds.forEach((pr, k) => {
        if(STRATEGIES[k].meta || !isBPSide(pr)) return;
        const w = smoothRate(series[k]) - 0.5;          // 正：照它押；負：反著押
        if(pr.side === 'B') sB += w; else sP += w;
        total += Math.abs(w);
      });
      if(!total || sB === sP) return null;
      return { side: sB > sP ? 'B' : 'P', conf: 50 + 50 * Math.abs(sB - sP) / total };
    }
  },
  {
    id: 'metaBest', name: '跟隨最佳', short: '最佳',
    rule: '跟著目前成功率最高的莊閒策略押（至少押過 5 手才列入）。信心率＝該策略的平滑成功率',
    meta: (preds, series) => {
      let best = -1, bestRate = -1;
      preds.forEach((pr, k) => {
        if(STRATEGIES[k].meta || !isBPSide(pr) || series[k].bets < 5) return;
        const r = smoothRate(series[k]);
        if(r > bestRate){ bestRate = r; best = k; }
      });
      if(best < 0) return null;
      return { side: preds[best].side, conf: bestRate * 100, from: STRATEGIES[best].name };
    }
  }
];

const STRATEGIES = [
  ...META_STRATEGIES,
  {
    id: 'banker', name: '跟莊', short: '莊',
    rule: '每手押莊，當作比較基準。信心率＝莊的理論勝率（不計和局）',
    predict: () => ({ side: 'B', conf: BANKER_SHARE })
  },
  {
    id: 'follow', name: '順勢跟路', short: '順',
    rule: '押上一手開出的一方。信心率＝本靴中「同樣連續長度後繼續延續」的實際比例',
    predict: ctx => {
      const R = ctx.results;
      if(!R.length) return null;
      // 連續長度分桶 1、2、3、4+；統計每個長度之後延續的次數（加一平滑）
      const n = [0,0,0,0,0], cont = [0,0,0,0,0];
      let run = 1;
      for(let j = 1; j < R.length; j++){
        const b = Math.min(run, 4);
        n[b]++;
        if(R[j] === R[j-1]){ cont[b]++; run++; } else run = 1;
      }
      const b = Math.min(run, 4);
      return { side: R[R.length - 1], conf: (cont[b] + 1) / (n[b] + 2) * 100 };
    }
  },
  {
    id: 'roads', name: '下三路多數決（紅）', short: '多紅',
    rule: '三條路一起問路，押「紅色較多」的一方，平手不押。信心率＝紅色路數 ÷ 可用路數',
    predict: ctx => {
      const v = askVotes(ctx.results);
      if(!v || v.redB === v.redP) return null;
      return { side: v.redB > v.redP ? 'B' : 'P', conf: Math.max(v.redB, v.redP) / v.avail * 100 };
    }
  },
  {
    id: 'roadsRev', name: '下三路多數決（藍）', short: '多藍',
    rule: '三條路一起問路，押「藍色較多」的一方，平手不押。信心率＝藍色路數 ÷ 可用路數',
    predict: ctx => {
      const v = askVotes(ctx.results);
      if(!v || v.blueB === v.blueP) return null;
      return { side: v.blueB > v.blueP ? 'B' : 'P', conf: Math.max(v.blueB, v.blueP) / v.avail * 100 };
    }
  },
  ...singleRoadStrategies(),
  {
    id: 'count', name: '算牌機率', short: '算',
    rule: '依剩餘牌精確計算，押機率較高的一方。信心率＝該方機率 ÷（莊＋閒）',
    predict: ctx => {
      const o = exactOdds(ctx.counts);
      if(!o) return null;
      const side = o.banker >= o.player ? 'B' : 'P';
      return { side, conf: Math.max(o.banker, o.player) / (o.banker + o.player) * 100 };
    }
  },
  {
    id: 'Talways', name: '只押和', short: '只和', ref: 100 / 9, ymax: 30,
    rule: '每一手都押和 1 注（賠 8 倍），當作押和的比較基準。信心率＝依剩餘牌精確算出的和局機率；基準＝損益兩平 11.11%',
    predict: ctx => {
      const o = exactOdds(ctx.counts);
      if(!o) return null;
      return { side: 'T', conf: o.tie * 100, ev: o.tie * (PAYOUT.T + 1) - 1 };
    }
  },
  ...sideBetStrategies(),
  {
    id: 'ev', name: '正期望值', short: '期望', chart: 'pnl',
    rule: '依剩餘牌精確算出莊（扣 5% 佣金）、閒、和（8 倍）、莊對／閒對（11 倍）每注的期望值，只在最高的那一種大於 0 時押它，其餘觀望。信心率＝該注期望值',
    predict: ctx => {
      const o = exactOdds(ctx.counts);
      if(!o) return null;
      const ev = betEVs(o, pairProbFromCounts(ctx.rcounts));
      let best = null;
      for(const k in ev) if(!best || ev[k] > ev[best]) best = k;
      return { side: ev[best] > 0 ? best : null, conf: ev[best] * 100, ev: ev[best], best };
    }
  },
  {
    id: 'triple', name: '三注齊押', short: '三注', chart: 'pnl',
    rule: '同一手同時押和、莊對、閒對各 1 注。依剩餘牌精確計算三注合計期望值（含三寶齊開加送），大於 0 才押。信心率＝平均每注期望值',
    predict: ctx => {
      const o = exactOdds(ctx.counts), pp = pairProbFromCounts(ctx.rcounts), j = pairJoint(ctx.rcounts);
      if(!o || pp == null) return null;
      const sum = tripleEV(o, pp, j);
      // ev：三注合計的期望值（注），用於預期盈虧
      return { side: sum > 0 ? 'TRI' : null, conf: sum / 3 * 100, ev: sum, best: 'TRI' };
    }
  },
  {
    id: 'tieBoth', name: '三寶齊開', short: '三寶', chart: 'pnl',
    rule: '預測同一手「和＋莊對＋閒對」三個同時開出。機率達到新靴時的 2 倍以上，就同時押和、莊對、閒對各 1 注；三個都中時另有加送（設定與資料可改）。信心率＝三個同時開出的精確機率',
    predict: ctx => {
      const j = pairJoint(ctx.rcounts), base = pairJointBase(ctx.machine.decks);
      const o = exactOdds(ctx.counts), pp = pairProbFromCounts(ctx.rcounts);
      if(!j || !base || !o || pp == null) return null;
      return { side: j.tieBoth >= base.tieBoth * 2 ? 'TRI' : null, conf: j.tieBoth * 100, ev: tripleEV(o, pp, j), best: 'TRI' };
    }
  },
  {
    id: 'bothPair', name: '雙對', short: '雙對', chart: 'pnl',
    rule: '預測同一手莊、閒兩邊都有對子。機率達到新靴時的 2 倍以上，就同時押莊對、閒對各 1 注。信心率＝雙對的精確機率',
    predict: ctx => {
      const j = pairJoint(ctx.rcounts), base = pairJointBase(ctx.machine.decks);
      const pp = pairProbFromCounts(ctx.rcounts);
      if(!j || !base || pp == null) return null;
      const evPair = pp * PAYOUT.BP - (1 - pp);
      return { side: j.both >= base.both * 2 ? 'DP' : null, conf: j.both * 100, ev: evPair * 2, best: 'DP' };
    }
  }
];

STRATEGIES.forEach(st => { st.cat = catOf(st.id); });

function backtest(m){
  const series = STRATEGIES.map(() => ({ pts: [], hits: 0, bets: 0, pnl: 0, evSum: 0, next: null }));
  const results = [];
  const shared = {};
  // 以往牌靴＝所有機台的舊靴＋其他機台目前這靴（不含正在回測的這一靴）
  const others = state.machines.flatMap(x => [...(x.shoes || []).map(sh => sh.hands), x.hands])
    .filter(h => h !== m.hands && h.length);
  for(let i = 0; i <= m.hands.length; i++){
    const ctx = { results, counts: valueCounts(m, i), rcounts: rankCounts(m, i), machine: m, i, others, shared };
    const preds = STRATEGIES.map(st => st.meta ? null : st.predict(ctx));
    // 綜合策略最後算：此時 series 只含這一手之前的成績
    STRATEGIES.forEach((st, k) => { if(st.meta) preds[k] = st.meta(preds, series); });
    if(i === m.hands.length){
      preds.forEach((pr, k) => { series[k].next = pr; });
      break;
    }
    const h = m.hands[i];
    const w = getWinner(h.player, h.banker);
    const bp = isPair(h.banker), pp = isPair(h.player);
    preds.forEach((pr, k) => {
      const sr = series[k];
      const side = pr ? pr.side : null;
      let hit = null;
      if(side === 'B' || side === 'P'){
        if(w !== 'T'){ sr.bets++; hit = side === w; }          // 押莊閒遇和局：不計
      } else if(COMBO[side]){
        sr.bets++;
        hit = betPnl(side, w, bp, pp) > 0;            // 組合注：整體有賺算押中
      } else if(side){
        sr.bets++;
        hit = side === 'T' ? w === 'T' : side === 'BP' ? bp : pp;
      }
      if(hit) sr.hits++;
      const gain = side ? betPnl(side, w, bp, pp) : null;
      if(side){ sr.pnl += gain; if(pr.ev != null) sr.evSum += pr.ev; }
      sr.pts.push({ n: i + 1, side, conf: pr ? pr.conf : null, w, bp, pp, hit, gain,
                    rate: sr.bets ? sr.hits / sr.bets * 100 : null,
                    pnlCum: sr.pnl, evCum: sr.evSum });
    });
    if(w !== 'T') results.push(w);
  }
  return series;
}

/* 策略顯示偏好：置頂清單與排序，存在雲端 state.prefs（各裝置同步） */
const SORTS = {
  default: { label: '預設順序' },
  conf:    { label: '信心率（下一手）', val: d => d.next ? d.next.conf : null },
  rate:    { label: '成功率',           val: d => d.bets ? d.hits / d.bets : null },
  hits:    { label: '押中次數',         val: d => d.hits },
  misses:  { label: '未押中次數',       val: d => d.bets - d.hits },
  edge:    { label: '優於基準（成功率−基準）', val: (d, st) => d.bets ? d.hits / d.bets * 100 - (st.ref || 50) : null },
  pnl:     { label: '盈虧（每手 1 注）', val: d => d.bets ? d.pnl : null }
};
function getPrefs(){
  if(!state.prefs || typeof state.prefs !== 'object') state.prefs = {};
  const pr = state.prefs;
  if(!Array.isArray(pr.pinned)) pr.pinned = [];       // Firebase 不存空陣列，讀回來可能不見
  if(!SORTS[pr.sort]) pr.sort = 'default';
  if(pr.dir !== 'asc') pr.dir = 'desc';
  if(pr.cat !== 'all' && !STRAT_CATS.some(c => c.id === pr.cat)) pr.cat = 'all';
  if(!Array.isArray(pr.collapsed)) pr.collapsed = [];
  return pr;
}
/* ========== 大分類（可收合、可上下移動） ==========
   順序與收合狀態存雲端 state.prefs.secOrder / secCollapsed */
const SECTIONS = [
  { key: 'stats',    id: 'sec-stats',     title: '統計' },
  { key: 'overview', id: 'sec-overview' },
  { key: 'bead',     id: 'sec-bead' },
  { key: 'bigroad',  id: 'bigroad-panel' },
  { key: 'derived',  id: 'sec-derived',   title: '下三路・問路' },
  { key: 'analysis', id: 'sec-analysis' },
  { key: 'ind',      id: 'sec-ind' },
  { key: 'strat',    id: 'sec-strat' },
  { key: 'shoe',     id: 'sec-shoe' },
  { key: 'history',  id: 'sec-history' },
  { key: 'settings', id: 'sec-settings',  title: '設定與資料' }
];
function secPrefs(){
  const pr = getPrefs();
  const keys = SECTIONS.map(x => x.key);
  if(!Array.isArray(pr.secOrder)) pr.secOrder = [];
  pr.secOrder = pr.secOrder.filter(k => keys.includes(k));
  // 之後新增的分類：插在它在預設清單中的前一個分類後面
  keys.forEach((k, i) => {
    if(pr.secOrder.includes(k)) return;
    const prev = keys.slice(0, i).reverse().find(x => pr.secOrder.includes(x));
    pr.secOrder.splice(prev ? pr.secOrder.indexOf(prev) + 1 : 0, 0, k);
  });
  if(!Array.isArray(pr.secCollapsed)) pr.secCollapsed = pr.secInit ? [] : ['settings'];   // 預設只收合設定
  pr.secInit = true;
  return pr;
}
function isSecCollapsed(key){ return secPrefs().secCollapsed.includes(key); }

function buildSections(){
  SECTIONS.forEach(sec => {
    let el = document.getElementById(sec.id), body;
    if(sec.key === 'stats'){
      // 統計原本不是 panel：包一層
      el.id = 'stats-grid';
      const wrap = document.createElement('section');
      wrap.className = 'panel';
      wrap.id = sec.id;
      el.replaceWith(wrap);
      body = document.createElement('div');
      body.appendChild(el);
      el = wrap;
    } else if(el.tagName === 'DETAILS'){
      // 設定原本是 <details>：換成一般大分類
      const wrap = document.createElement('section');
      wrap.className = 'panel';
      wrap.id = sec.id;
      body = document.createElement('div');
      [...el.childNodes].forEach(n => { if(n.nodeName !== 'SUMMARY') body.appendChild(n); });
      el.replaceWith(wrap);
      el = wrap;
    } else {
      const h2 = el.querySelector(':scope > h2');
      if(!sec.title && h2) sec.title = h2.textContent;
      if(h2) h2.remove();
      body = document.createElement('div');
      while(el.firstChild) body.appendChild(el.firstChild);
    }
    body.className = 'sec-body';
    el.classList.add('sec');
    el.dataset.sec = sec.key;
    const head = document.createElement('div');
    head.className = 'sec-head';
    head.innerHTML = '<button class="sec-title" data-sec-toggle="' + sec.key + '"><span class="chev">▾</span>' + sec.title + '<span class="sub"></span></button>' +
      '<button class="sec-move" data-sec-move="up" data-key="' + sec.key + '" aria-label="往上移">▲</button>' +
      '<button class="sec-move" data-sec-move="down" data-key="' + sec.key + '" aria-label="往下移">▼</button>';
    el.append(head, body);
    sec.el = el;
  });
}
function applySectionLayout(){
  const pr = secPrefs();
  const anchor = document.getElementById('fab-wrap');
  const sep = document.querySelector('#fab-menu .fab-sep');
  pr.secOrder.forEach((key, i) => {
    const sec = SECTIONS.find(x => x.key === key);
    anchor.parentNode.insertBefore(sec.el, anchor);
    const collapsed = pr.secCollapsed.includes(key);
    sec.el.classList.toggle('collapsed', collapsed);
    sec.el.querySelector('[data-sec-toggle]').setAttribute('aria-expanded', String(!collapsed));
    sec.el.querySelector('[data-sec-move="up"]').disabled = i === 0;
    sec.el.querySelector('[data-sec-move="down"]').disabled = i === pr.secOrder.length - 1;
    // 浮動選單跟著同樣順序
    const link = document.querySelector('#fab-menu a[href="#' + sec.id + '"]');
    if(link) sep.parentNode.insertBefore(link, sep);
  });
}
function expandSection(key){
  const pr = secPrefs();
  if(!pr.secCollapsed.includes(key)) return false;
  pr.secCollapsed = pr.secCollapsed.filter(k => k !== key);
  applySectionLayout();
  render();
  state.lastModified = Date.now();
  schedulePush();
  return true;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-sec-toggle]');
  if(t){
    const pr = secPrefs(), key = t.dataset.secToggle;
    const opening = pr.secCollapsed.includes(key);
    pr.secCollapsed = opening ? pr.secCollapsed.filter(k => k !== key) : [...pr.secCollapsed, key];
    applySectionLayout();
    if(opening) render();                          // 展開後依實際寬度重畫
    state.lastModified = Date.now();
    schedulePush();
    return;
  }
  const mv = e.target.closest('[data-sec-move]');
  if(mv){
    const pr = secPrefs(), key = mv.dataset.key;
    const i = pr.secOrder.indexOf(key), j = mv.dataset.secMove === 'up' ? i - 1 : i + 1;
    if(j < 0 || j >= pr.secOrder.length) return;
    [pr.secOrder[i], pr.secOrder[j]] = [pr.secOrder[j], pr.secOrder[i]];
    applySectionLayout();
    const el = SECTIONS.find(x => x.key === key).el;
    el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    state.lastModified = Date.now();
    schedulePush();
  }
});

/* 置頂的排前面；同一群內依選定欄位排序，沒有數值的排最後，平手照預設順序 */
function orderStrategies(data){
  const pr = getPrefs();
  const sort = SORTS[pr.sort];
  const sign = pr.dir === 'asc' ? 1 : -1;
  return STRATEGIES.map((st, k) => ({ st, k, d: data[k], pinned: pr.pinned.includes(st.id) }))
    .sort((a, b) => {
      if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      if(sort.val){
        const va = sort.val(a.d, a.st), vb = sort.val(b.d, b.st);
        if(va == null && vb != null) return 1;
        if(vb == null && va != null) return -1;
        if(va != null && vb != null && va !== vb) return (va - vb) * sign;
      }
      return a.k - b.k;
    });
}

const sideTxt = s => ({ B: '莊', P: '閒', T: '和', BP: '莊對', PP: '閒對', TRI: '和＋雙對', DP: '雙對' })[s] || '—';

function stratCard({ st, k, d, pinned }){
  const nx = d.next;
  return '<div class="strat' + (pinned ? ' pinned' : '') + '">' +
    '<div class="strat-head"><span class="strat-name">' + st.name + '</span>' +
    '<button class="pin-btn' + (pinned ? ' on' : '') + '" data-pin="' + st.id + '" aria-pressed="' + pinned + '">' + (pinned ? '★ 已置頂' : '☆ 置頂') + '</button>' +
    '<button class="view-btn" data-view="' + st.id + '">押注明細</button>' +
    '<span class="strat-next">下一手 <span class="side ' + (nx && nx.side ? nx.side : '') + '">' + (nx && nx.side ? sideTxt(nx.side) : '觀望') + '</span>' +
    (nx ? (nx.ev != null
      ? '<span>' + (nx.side ? '' : (COMBO[nx.best] ? '' : '最高 ' + sideTxt(nx.best) + ' ')) + (COMBO[nx.best] ? (nx.best === 'TRI' ? '三注' : '兩注') + '合計期望 <b>' + (nx.ev > 0 ? '+' : '') + nx.ev.toFixed(3) + ' 注</b>' : '期望值 <b>' + (nx.ev > 0 ? '+' : '') + (nx.ev * 100).toFixed(2) + '%</b>') + '</span>'
      : '<span>信心 <b>' + nx.conf.toFixed(1) + '%</b></span>') : '') + '</span>' +
    (nx && nx.from ? '<span class="strat-rule">目前跟：' + nx.from + '</span>' : '') +
    '<span class="strat-rule">' + st.rule + '</span></div>' +
    '<div class="strat-kpi"><span>成功率 <b>' + (d.bets ? (d.hits / d.bets * 100).toFixed(1) + '%' : '—') + '</b></span>' +
    '<span>押中 <b>' + d.hits + '</b></span><span>未中 <b>' + (d.bets - d.hits) + '</b></span><span>共 ' + d.bets + ' 手</span>' +
    (st.ref ? '<span>基準 ' + st.ref.toFixed(2) + '%</span>' : '') +
    '<span>盈虧 <b class="' + (d.pnl > 0 ? 'pos' : d.pnl < 0 ? 'neg' : '') + '">' + fmtUnits(d.pnl) + '</b> 注（' + fmtMoney(d.pnl) + '）</span></div>' +
    '<div class="chart" data-k="' + k + '"></div></div>';
}

/* ========== 全機台總覽 ==========
   每台機台回測所有策略，挑盈虧最高者（至少押 5 次）；另加全部機台合計排行 */
const OV_MIN_BETS = 5;
let btCache = new WeakMap();                        // hands 陣列 → 回測結果（陣列被換掉時自動回收）
function backtestHands(hands, decks){
  const hit = btCache.get(hands);
  if(hit && hit.len === hands.length && hit.decks === decks) return hit.data;
  const data = backtest({ hands, decks });
  btCache.set(hands, { len: hands.length, decks, data });
  return data;
}
function renderOverview(){
  if(isSecCollapsed('overview')) return;
  const el = document.getElementById('overview');
  const pr = getPrefs();
  const scope = pr.ovScope === 'all' ? 'all' : 'cur';
  const rows = [];
  const total = STRATEGIES.map(() => ({ pnl: 0, bets: 0, hits: 0, machines: 0 }));
  state.machines.forEach(m => {
    const sets = [m.hands].concat(scope === 'all' ? (m.shoes || []).map(sh => sh.hands) : []);
    const decksOf = h => { const sh = (m.shoes || []).find(x => x.hands === h); return sh ? sh.decks : m.decks; };
    const agg = STRATEGIES.map(() => ({ pnl: 0, bets: 0, hits: 0 }));
    let handsN = 0, next = null;
    sets.forEach(h => {
      if(!h.length) return;
      handsN += h.length;
      const data = backtestHands(h, decksOf(h));
      data.forEach((d, k) => { agg[k].pnl += d.pnl; agg[k].bets += d.bets; agg[k].hits += d.hits; });
      if(h === m.hands) next = data.map(d => d.next);
    });
    if(!handsN) return;
    let best = -1;
    agg.forEach((a, k) => {
      total[k].pnl += a.pnl; total[k].bets += a.bets; total[k].hits += a.hits; if(a.bets) total[k].machines++;
      if(a.bets >= OV_MIN_BETS && (best < 0 || a.pnl > agg[best].pnl)) best = k;
    });
    rows.push({ m, handsN, shoes: scope === 'all' ? sets.filter(h => h.length).length : 1, best, a: best >= 0 ? agg[best] : null,
                nx: best >= 0 && next ? next[best] : null });
  });
  rows.sort((x, y) => (y.a ? y.a.pnl : -1e9) - (x.a ? x.a.pnl : -1e9));

  let html = '<div class="ov-scope" role="tablist">' +
    '<button data-ov="cur" class="' + (scope === 'cur' ? 'on' : '') + '">目前牌靴</button>' +
    '<button data-ov="all" class="' + (scope === 'all' ? 'on' : '') + '">全部牌靴（含舊靴）</button></div>';
  if(!rows.length){
    el.innerHTML = html + '<div class="empty">還沒有任何機台有紀錄</div>';
    return;
  }
  html += '<table class="ov-table"><thead><tr><th>機台</th><th>最高獲利策略</th><th class="num">盈虧</th><th class="num">下一手</th></tr></thead><tbody>';
  rows.forEach(r => {
    const cur = r.m.id === state.activeId;
    html += '<tr class="row' + (cur ? ' cur' : '') + '" data-ov-m="' + r.m.id + '">' +
      '<td><span class="mn">' + escapeHtml(r.m.name) + '</span><span class="sub">' + r.handsN + ' 局' + (scope === 'all' ? '・' + r.shoes + ' 靴' : '') + '</span></td>';
    if(r.a){
      html += '<td>' + STRATEGIES[r.best].name + '<span class="sub">成功率 ' + (r.a.hits / r.a.bets * 100).toFixed(1) + '%・押 ' + r.a.bets + ' 次</span></td>' +
        '<td class="num ' + (r.a.pnl > 0 ? 'pos' : r.a.pnl < 0 ? 'neg' : '') + '">' + fmtUnits(r.a.pnl) + ' 注</td>' +
        '<td class="num"><span class="nx ' + (r.nx && r.nx.side ? r.nx.side : '') + '">' + (r.nx && r.nx.side ? sideTxt(r.nx.side) : scope === 'cur' || r.nx ? '觀望' : '—') + '</span></td>';
    } else {
      html += '<td colspan="3" class="sub">押注次數還不夠（每個策略至少押 ' + OV_MIN_BETS + ' 次才比較）</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table>';

  // 全部機台合計排行
  const ranked = total.map((t, k) => ({ t, k })).filter(x => x.t.bets >= OV_MIN_BETS).sort((a, b) => b.t.pnl - a.t.pnl).slice(0, 5);
  if(ranked.length){
    html += '<div class="ov-h">全部機台合計・盈虧前 5 名</div><table class="ov-table"><thead><tr><th>策略</th><th class="num">成功率</th><th class="num">押注</th><th class="num">盈虧</th></tr></thead><tbody>';
    ranked.forEach(({ t, k }) => {
      html += '<tr><td>' + STRATEGIES[k].name + '<span class="sub">' + t.machines + ' 台機台有押</span></td>' +
        '<td class="num">' + (t.hits / t.bets * 100).toFixed(1) + '%</td><td class="num">' + t.bets + '</td>' +
        '<td class="num ' + (t.pnl > 0 ? 'pos' : t.pnl < 0 ? 'neg' : '') + '">' + fmtUnits(t.pnl) + ' 注</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '<div class="ov-note">盈虧＝每手押 1 注（莊抽 5%、和 8 倍、對子 11 倍）。「最高獲利」是過去的結果，押注次數少時多半是運氣；' +
    '點機台那一列可切換過去。</div>';
  el.innerHTML = html;
}

function fmtUnits(v){ return (v > 0 ? '+' : '') + (Math.round(v * 100) / 100).toFixed(2); }

function renderStrategies(){
  if(isSecCollapsed('strat')) return;
  const el = document.getElementById('strategies');
  const m = getActive();
  const data = getBacktest(m);
  let html = '<div class="strat-legend"><span><i></i>成功率（累計）</span><span><i class="conf"></i>信心率（該手）</span></div>' +
    '<div class="strat-note">成功率＝押中次數 ÷ 下注次數。押莊閒時和局不計，基準 50%；押和局／對子每手都計，' +
    '基準是賠率的損益兩平點（和 8 倍 11.11%、對子 11 倍 8.33%）。百家樂每手結果互相獨立，路單類策略長期會回到基準附近；' +
    '信心率是策略本身的訊號強弱或預估機率，不代表保證。</div>';
  const pr = getPrefs();
  html += '<div class="strat-ctrl"><label for="strat-sort">排序</label><select id="strat-sort">' +
    Object.keys(SORTS).map(key => '<option value="' + key + '"' + (pr.sort === key ? ' selected' : '') + '>' + SORTS[key].label + '</option>').join('') +

    (pr.sort === 'default' ? '' : '<button id="strat-dir" aria-label="切換排序方向">' + (pr.dir === 'asc' ? '↑ 由低到高' : '↓ 由高到低') + '</button>') +
    '<span class="hint">置頂 ' + pr.pinned.length + ' 個 · 置頂的策略固定在最上面</span></div>';
  const ordered = orderStrategies(data);
  const count = id => STRATEGIES.filter(st => st.cat === id).length;
  html += '<div class="cat-chips" role="tablist">' +
    '<button class="cat-chip' + (pr.cat === 'all' ? ' on' : '') + '" data-cat="all" role="tab" aria-selected="' + (pr.cat === 'all') + '">全部<span class="n">' + STRATEGIES.length + '</span></button>' +
    STRAT_CATS.map(c => '<button class="cat-chip' + (pr.cat === c.id ? ' on' : '') + '" data-cat="' + c.id + '" role="tab" aria-selected="' + (pr.cat === c.id) + '">' +
      c.label + '<span class="n">' + count(c.id) + '</span></button>').join('') + '</div>';

  // 分組：「全部」時置頂集中在最上面，其餘依類別；單一類別時只顯示該類（置頂排前）
  let groups;
  if(pr.cat === 'all'){
    groups = [{ id: 'pinned', label: '★ 置頂', items: ordered.filter(o => o.pinned) }]
      .concat(STRAT_CATS.map(c => ({ id: c.id, label: c.label, items: ordered.filter(o => !o.pinned && o.st.cat === c.id) })));
  } else {
    const c = STRAT_CATS.find(c => c.id === pr.cat);
    groups = [{ id: c.id, label: c.label, items: ordered.filter(o => o.st.cat === c.id) }];
  }
  groups = groups.filter(g => g.items.length);
  const visible = [];
  groups.forEach(g => {
    const collapsed = pr.collapsed.includes(g.id);
    // 組內表現最好：優於基準最多、且至少押過 5 手
    let best = null;
    g.items.forEach(o => {
      if(o.d.bets < 5) return;
      const edge = o.d.hits / o.d.bets * 100 - (o.st.ref || 50);
      if(!best || edge > best.edge) best = { o, edge };
    });
    html += '<div class="strat-group' + (g.id === 'pinned' ? ' pinned-grp' : '') + '">' +
      '<button class="grp-head" data-group="' + g.id + '" aria-expanded="' + !collapsed + '">' + g.label +
      '<span class="cnt">' + g.items.length + ' 個</span>' +

      '<span class="arrow">' + (collapsed ? '▸' : '▾') + '</span></button>';
    if(!collapsed){
      html += '<div class="grp-body">';
      g.items.forEach(o => { visible.push(o); html += stratCard(o); });
      html += '</div>';
    }
    html += '</div>';
  });
  // 數據表（無障礙／精確數字）
  const last = Math.max(0, m.hands.length - 30);
  if(visible.length) html += '<details class="strat-table"><summary>數據表（最近 30 手・目前展開的策略）</summary><div class="tbl"><table><thead><tr><th>#</th><th>結果</th>' +
    visible.map(o => '<th>' + o.st.short + '</th>').join('') + '</tr></thead><tbody>';
  for(let i = m.hands.length - 1; visible.length && i >= last; i--){
    const w = data[0].pts[i].w;
    html += '<tr><td>' + (i + 1) + '</td><td>' + sideTxt(w) + '</td>' + visible.map(({ d }) => {
      const pt = d.pts[i];
      if(!pt.side) return '<td>—</td>';   // 觀望
      const mark = pt.hit === null ? '' : pt.hit ? ' <span class="ok">✓</span>' : ' <span class="ng">✗</span>';
      return '<td>' + sideTxt(pt.side) + mark + '</td>';
    }).join('') + '</tr>';
  }
  if(visible.length) html += '</tbody></table></div></details>';
  el.innerHTML = html;
  el.querySelectorAll('.chart').forEach(c => drawStrategyChart(c, data[+c.dataset.k], STRATEGIES[+c.dataset.k]));
}

/* 單一策略走勢圖：一條 y 軸（0~100%），成功率實線、信心率虛線 */
function drawStrategyChart(box, d, st){
  if(st && st.chart === 'pnl'){
    // 實際累計盈虧 vs 預期累計盈虧（每次下注的期望值加總），單位：注
    return drawLineChart(box, d.pts, [
      { key: 'pnlCum', color: 'var(--series-1)', label: '實際盈虧' },
      { key: 'evCum',  color: 'var(--series-2)', label: '預期盈虧', dash: true }
    ], { signed: true, unit: '注', lastLabel: '#' + d.pts.length, pointLabel: p => '#' + p.n + '　' +
         (p.side ? '押' + sideTxt(p.side) + (p.gain > 0 ? ' ✓ ' : p.gain < 0 ? ' ✗ ' : ' 退回 ') + fmtUnits(p.gain) + ' 注' : '觀望') });
  }
  const W = Math.max(200, box.clientWidth || 320), H = 120;
  const ml = 34, mr = 44, mt = 8, mb = 20;
  const pw = W - ml - mr, ph = H - mt - mb;
  const pts = d.pts, N = pts.length;
  const NS = 'http://www.w3.org/2000/svg';
  if(!N){ box.innerHTML = '<div class="empty">尚無紀錄</div>'; return; }
  const x = n => ml + (N === 1 ? pw / 2 : (n - 1) / (N - 1) * pw);
  // 押和局／對子的策略數值小，y 軸上限取 30%（有更高的值時往上放大）
  const ref = st && st.ref ? st.ref : 50;
  let ymax = 100;
  if(st && st.ymax){
    const mx = pts.reduce((a, p) => Math.max(a, p.rate || 0, p.conf || 0), 0);
    ymax = Math.min(100, Math.max(st.ymax, Math.ceil(mx / 10) * 10));
  }
  const y = v => mt + (1 - Math.min(v, ymax) / ymax) * ph;
  const path = key => {
    let dstr = '', pen = false;
    for(const p of pts){
      const v = p[key];
      if(v == null){ pen = false; continue; }
      dstr += (pen ? 'L' : 'M') + x(p.n).toFixed(1) + ',' + y(v).toFixed(1);
      pen = true;
    }
    return dstr;
  };
  const lastOf = key => { for(let i = N - 1; i >= 0; i--) if(pts[i][key] != null) return pts[i]; return null; };
  let svg = '<svg xmlns="' + NS + '" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="成功率與信心率走勢">';
  [0, ymax / 4, ymax / 2, ymax * 3 / 4, ymax].forEach((v, idx) => {
    svg += '<line x1="' + ml + '" x2="' + (ml + pw) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--grid)" stroke-width="1"/>';
    if(idx % 2 === 0 && Math.abs(v - ref) > ymax * .08)
      svg += '<text x="' + (ml - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--axis)">' + (+v.toFixed(1)) + '%</text>';
  });
  // 基準線（莊閒 50%；和局／對子＝損益兩平）
  svg += '<line x1="' + ml + '" x2="' + (ml + pw) + '" y1="' + y(ref) + '" y2="' + y(ref) + '" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>';
  svg += '<text x="' + (ml - 6) + '" y="' + (y(ref) + 4) + '" text-anchor="end" font-size="11" fill="#c9d1d9">' + (+ref.toFixed(1)) + '%</text>';
  svg += '<text x="' + ml + '" y="' + (H - 4) + '" font-size="11" fill="var(--axis)">#1</text>';
  svg += '<text x="' + (ml + pw) + '" y="' + (H - 4) + '" text-anchor="end" font-size="11" fill="var(--axis)">#' + N + '</text>';
  svg += '<path d="' + path('conf') + '" fill="none" stroke="var(--series-2)" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/>';
  svg += '<path d="' + path('rate') + '" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  // 端點標籤（文字用中性色，顏色由圓點表示）
  const ends = [['rate', 'var(--series-1)'], ['conf', 'var(--series-2)']].map(([key, col]) => {
    const p = lastOf(key);
    return p ? { key, col, p, yy: y(p[key]) } : null;
  }).filter(Boolean);
  if(ends.length === 2 && Math.abs(ends[0].yy - ends[1].yy) < 13){       // 避免兩個標籤重疊
    const mid = (ends[0].yy + ends[1].yy) / 2, up = ends[0].yy <= ends[1].yy ? 0 : 1;
    ends[up].ly = mid - 7; ends[1 - up].ly = mid + 7;
  }
  ends.forEach(e => {
    svg += '<circle cx="' + x(e.p.n) + '" cy="' + e.yy + '" r="4" fill="' + e.col + '" stroke="var(--surface)" stroke-width="2"/>';
    svg += '<text x="' + (ml + pw + 6) + '" y="' + ((e.ly != null ? e.ly : e.yy) + 4) + '" font-size="11" fill="var(--text-2)">' +
           Math.round(e.p[e.key]) + '%</text>';
  });
  svg += '<line class="xh" y1="' + mt + '" y2="' + (mt + ph) + '" stroke="#8b949e" stroke-width="1" visibility="hidden"/>';
  svg += '<circle class="h1" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>';
  svg += '<circle class="h2" r="4" fill="var(--series-2)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>';
  svg += '<rect x="' + ml + '" y="0" width="' + pw + '" height="' + H + '" fill="transparent"/>';
  svg += '</svg><div class="chart-tip"></div>';
  box.innerHTML = svg;

  // 十字線 + 提示（滑鼠與觸控）
  const el = box.querySelector('svg'), tip = box.querySelector('.chart-tip');
  const xh = el.querySelector('.xh'), h1 = el.querySelector('.h1'), h2 = el.querySelector('.h2');
  const show = ev => {
    const r = el.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(N - 1, Math.round(N === 1 ? 0 : (px - ml) / pw * (N - 1))));
    const p = pts[i], cx = x(p.n);
    xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
    const dot = (c, v) => {
      if(v == null){ c.setAttribute('visibility', 'hidden'); return; }
      c.setAttribute('cx', cx); c.setAttribute('cy', y(v)); c.setAttribute('visibility', 'visible');
    };
    dot(h1, p.rate); dot(h2, p.conf);
    const res = p.side == null ? '不押' : p.hit === null ? '押' + sideTxt(p.side) + '（和局不計）'
              : '押' + sideTxt(p.side) + (p.hit ? ' ✓' : ' ✗');

/* ========== 牌靴指標 ==========
   每一點＝「發這一手之前」的狀態；最後一點是下一手。
   預期：依當時剩餘牌精確計算；實際：到前一手為止的累計比例 */
const IND_MIN_HANDS = 10;                            // 實際值滿 10 手才畫，避免前幾手 0% / 100% 撐開圖
function shoeIndicators(m){
  const pts = [];
  let bw = 0, pw = 0, n = 0, draws = 0, flips = 0;
  for(let i = 0; i <= m.hands.length; i++){
    const o = exactOdds(valueCounts(m, i));
    const act = n >= IND_MIN_HANDS;
    pts.push({
      n: i + 1,
      edgeExp: o ? (o.banker - o.player) * 100 : null,
      edgeAct: act ? (bw - pw) / n * 100 : null,
      drawExp: o ? o.draw * 100 : null,
      drawAct: act ? draws / n * 100 : null,
      flipExp: o ? o.flip * 100 : null,
      flipAct: act ? flips / n * 100 : null
    });
    if(i === m.hands.length) break;
    const h = m.hands[i];
    const w = getWinner(h.player, h.banker);
    const w2 = getWinner(h.player.slice(0, 2), h.banker.slice(0, 2));
    const drew = h.player.length > 2 || h.banker.length > 2;
    n++;
    if(w === 'B') bw++; else if(w === 'P') pw++;
    if(drew){ draws++; if(w !== w2) flips++; }
  }
  return pts;
}

const INDICATORS = [
  { id: 'edge', name: '牌靴強弱（莊 − 閒）', exp: 'edgeExp', act: 'edgeAct', ref: 1.24, refLabel: '新靴 +1.24',
    signed: true,
    desc: '預期＝剩餘牌算出的莊勝率減閒勝率（往上偏莊、往下偏閒）；實際＝已開出的（莊 − 閒）÷ 局數' },
  { id: 'draw', name: '補牌率', exp: 'drawExp', act: 'drawAct', ref: null,
    desc: '有人補第三張（沒有天牌）的比例。剩餘 8、9 點多時天牌變多、補牌變少' },
  { id: 'flip', name: '補牌翻盤率', exp: 'flipExp', act: 'flipAct', ref: null,
    desc: '補牌後贏家和「前兩張領先的一方」不同的比例（含前兩張平手被補開、或補成和局）' }
];

function fmtPct(v, signed){ return v == null ? '—' : (signed && v > 0 ? '+' : '') + v.toFixed(2) + '%'; }

  INDICATORS.forEach(ind => {

      '<span class="ind-now">下一手預期 <b>' + fmtPct(last[ind.exp], ind.signed) + '</b>　實際 ' + fmtPct(last[ind.act], ind.signed) + '</span>' +
      '<span class="ind-desc">' + ind.desc + '</span></div>' +

    ], { ref: ind.ref, refLabel: ind.refLabel, signed: ind.signed });
  });
}

/* 通用折線圖：單一 y 軸，範圍依資料自動取；最後一點標示為「下一手」 */
function drawLineChart(box, pts, series, opt){
  const W = Math.max(200, box.clientWidth || 320), H = 120;
  const ml = 44, mr = 52, mt = 8, mb = 20;
  const pw = W - ml - mr, ph = H - mt - mb;
  const N = pts.length;
  let lo = Infinity, hi = -Infinity;
  pts.forEach(p => series.forEach(s => { const v = p[s.key]; if(v != null){ lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  if(opt.ref != null){ lo = Math.min(lo, opt.ref); hi = Math.max(hi, opt.ref); }
  if(!isFinite(lo)){ box.innerHTML = '<div class="empty">尚無資料</div>'; return; }
  if(opt.signed){ lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = Math.max(1, (hi - lo) * .1);
  lo = Math.floor(lo - pad); hi = Math.ceil(hi + pad);
  if(!opt.signed) lo = Math.max(0, lo);
  const x = n => ml + (N === 1 ? pw / 2 : (n - 1) / (N - 1) * pw);
  const y = v => mt + (1 - (v - lo) / (hi - lo)) * ph;
  const unit = opt.unit || '%';
  const fmt = v => (opt.signed && v > 0 ? '+' : '') + (+v.toFixed(1)) + unit;
  const fmtV = v => v == null ? '—' : unit === '%' ? fmtPct(v, opt.signed) : (opt.signed && v > 0 ? '+' : '') + v.toFixed(2) + ' ' + unit;
  let svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + series.map(s => s.label).join('與') + '走勢">';
  [lo, (lo + hi) / 2, hi].forEach(v => {
    svg += '<line x1="' + ml + '" x2="' + (ml + pw) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--grid)" stroke-width="1"/>';
    svg += '<text x="' + (ml - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--axis)">' + fmt(v) + '</text>';
  });
  if(opt.signed && lo < 0 && hi > 0)
    svg += '<line x1="' + ml + '" x2="' + (ml + pw) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#57606a" stroke-width="1"/>';
  if(opt.ref != null){
    svg += '<line x1="' + ml + '" x2="' + (ml + pw) + '" y1="' + y(opt.ref) + '" y2="' + y(opt.ref) + '" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>';
    svg += '<text x="' + (ml + 4) + '" y="' + (y(opt.ref) - 4) + '" font-size="10" fill="var(--axis)">' + opt.refLabel + '</text>';
  }
  svg += '<text x="' + ml + '" y="' + (H - 4) + '" font-size="11" fill="var(--axis)">#1</text>';
  svg += '<text x="' + (ml + pw) + '" y="' + (H - 4) + '" text-anchor="end" font-size="11" fill="var(--axis)">' + (opt.lastLabel || '下一手') + '</text>';
  series.slice().reverse().forEach(s => {
    let d = '', pen = false;
    pts.forEach(p => { const v = p[s.key]; if(v == null){ pen = false; return; } d += (pen ? 'L' : 'M') + x(p.n).toFixed(1) + ',' + y(v).toFixed(1); pen = true; });
    svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round"' + (s.dash ? ' stroke-dasharray="5 3"' : ' stroke-linecap="round"') + '/>';
  });
  // 端點標籤（避免重疊）
  const ends = series.map(s => {
    for(let i = N - 1; i >= 0; i--) if(pts[i][s.key] != null) return { s, p: pts[i], yy: y(pts[i][s.key]) };
    return null;
  }).filter(Boolean);
  if(ends.length === 2 && Math.abs(ends[0].yy - ends[1].yy) < 13){
    const mid = (ends[0].yy + ends[1].yy) / 2, up = ends[0].yy <= ends[1].yy ? 0 : 1;
    ends[up].ly = mid - 7; ends[1 - up].ly = mid + 7;
  }
  ends.forEach(e => {
    svg += '<circle cx="' + x(e.p.n) + '" cy="' + e.yy + '" r="4" fill="' + e.s.color + '" stroke="var(--surface)" stroke-width="2"/>';
    svg += '<text x="' + (ml + pw + 6) + '" y="' + ((e.ly != null ? e.ly : e.yy) + 4) + '" font-size="11" fill="var(--text-2)">' + fmt(e.p[e.s.key]) + '</text>';
  });
  svg += '<line class="xh" y1="' + mt + '" y2="' + (mt + ph) + '" stroke="#8b949e" stroke-width="1" visibility="hidden"/>';
  series.forEach((s, i) => { svg += '<circle class="hd' + i + '" r="4" fill="' + s.color + '" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>'; });
  svg += '<rect x="' + ml + '" y="0" width="' + pw + '" height="' + H + '" fill="transparent"/></svg><div class="chart-tip"></div>';
  box.innerHTML = svg;

  const el = box.querySelector('svg'), tip = box.querySelector('.chart-tip'), xh = el.querySelector('.xh');
  const show = ev => {
    const r = el.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(N - 1, Math.round(N === 1 ? 0 : (px - ml) / pw * (N - 1))));
    const p = pts[i], cx = x(p.n);
    xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
    series.forEach((s, k) => {
      const c = el.querySelector('.hd' + k), v = p[s.key];
      if(v == null){ c.setAttribute('visibility', 'hidden'); return; }
      c.setAttribute('cx', cx); c.setAttribute('cy', y(v)); c.setAttribute('visibility', 'visible');
    });
    tip.innerHTML = '<b>' + (opt.pointLabel ? opt.pointLabel(p) : i === N - 1 ? '下一手' : '第 ' + p.n + ' 手前') + '</b>' + series.map(s =>
      '<br><span class="k" style="background:' + s.color + '"></span>' + s.label + ' ' + fmtV(p[s.key])).join('');
    tip.style.display = 'block';
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(r.width - tw, cx / W * r.width - tw / 2)) + 'px';
    tip.style.top = (-tip.offsetHeight - 4) + 'px';
  };
  const hide = () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); series.forEach((s, k) => el.querySelector('.hd' + k).setAttribute('visibility', 'hidden')); };
  el.addEventListener('pointermove', show);
  el.addEventListener('pointerdown', show);
  el.addEventListener('pointerleave', hide);
  el.addEventListener('pointercancel', hide);
}

/* ========== 輸入 UI ========== */
/* 輸入順序：閒1 → 閒2 → 莊1 → 莊2 → (依補牌規則) 閒3 → 莊3
   第三張要不要輸入由補牌規則決定，不需要的格子自動跳過 */
const emptyInput = () => ({ p: [null,null,null], b: [null,null,null] });
let input = emptyInput();
let activeSlot = { side: 'p', idx: 0 };

function cardsOf(ranks){ return ranks.filter(Boolean).map(r => ({ rank: r, suit: DEFAULT_SUIT })); }
function bankerDraws(bv, p3){
  return bankerDrawsVal(bv, p3 === null ? null : rankValue(p3));
}
/* 目前輸入內容下「需要」的格子，依輸入順序；第三張要等前面的牌確定才知道要不要 */
function requiredSlots(inp){
  const req = [{side:'p',idx:0},{side:'p',idx:1},{side:'b',idx:0},{side:'b',idx:1}];
  if(!inp.p[0] || !inp.p[1] || !inp.b[0] || !inp.b[1]) return req;
  const pv = handValue(cardsOf(inp.p.slice(0,2)));
  const bv = handValue(cardsOf(inp.b.slice(0,2)));
  if(pv >= 8 || bv >= 8) return req;                 // 天牌，雙方都不補
  if(pv <= 5){
    req.push({side:'p',idx:2});
    if(!inp.p[2]) return req;                        // 要先知道閒家第三張
    if(bankerDraws(bv, inp.p[2])) req.push({side:'b',idx:2});
  } else if(bankerDraws(bv, null)){
    req.push({side:'b',idx:2});
  }
  return req;
}
function isRequired(inp, side, idx){
  return requiredSlots(inp).some(s => s.side === side && s.idx === idx);
}
/* 改了前面的牌導致第三張不需要時，清掉多餘的第三張 */
function pruneInput(){
  for(const side of ['p','b']){
    if(input[side][2] && !isRequired(input, side, 2)) input[side][2] = null;
  }
}
function nextEmptySlot(){
  return requiredSlots(input).find(s => !input[s.side][s.idx]) || null;
}
function inputComplete(){ return nextEmptySlot() === null; }
/* 第三張是否已確定「不補」 */
function thirdSkipped(side){
  const inp = input;
  if(!inp.p[0] || !inp.p[1] || !inp.b[0] || !inp.b[1]) return false;
  if(isRequired(inp, side, 2)) return false;
  if(side === 'b' && isRequired(inp, 'p', 2) && !inp.p[2]) return false;   // 還不知道
  return true;
}

function buzz(){ try{ navigator.vibrate && navigator.vibrate(8); }catch(e){} }

function buildSlots(){
  ['p', 'b'].forEach(side => {
    const container = document.getElementById(side + '-slots');
    container.innerHTML = '';
    for(let i = 0; i < 3; i++){
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.addEventListener('click', () => {
        // 可點已填的格子修改，或點下一個該填的格子
        const next = nextEmptySlot();
        const isNext = next && next.side === side && next.idx === i;
        if(!input[side][i] && !isNext) return;
        activeSlot = { side, idx: i };
        buzz();
        renderInput();
      });
      container.appendChild(slot);
    }
  });
}

function buildKeypad(){
  const pad = document.getElementById('keypad');
  pad.innerHTML = '';
  RANKS.forEach(r => {
    const k = document.createElement('button');
    k.className = 'key rank';
    k.textContent = r;
    k.addEventListener('click', () => enterRank(r));
    pad.appendChild(k);
  });
  const back = document.createElement('button');
  back.className = 'key back';
  back.textContent = '⌫';
  back.setAttribute('aria-label', '刪除上一張');
  back.addEventListener('click', backspace);
  pad.appendChild(back);
  const rec = document.createElement('button');
  rec.className = 'key rec';
  rec.id = 'record';
  rec.textContent = '記錄';
  rec.addEventListener('click', recordHand);
  pad.appendChild(rec);
}

function enterRank(r){
  if(viewShoe){ editable(); return; }
  if(!activeSlot){ buzz(); return; }                 // 這手已輸入完成
  input[activeSlot.side][activeSlot.idx] = r;
  pruneInput();
  activeSlot = nextEmptySlot();
  buzz();
  renderInput();
}
/* ⌫：刪掉輸入順序上最後一張已填的牌 */
function backspace(){
  if(viewShoe) return;
  const filled = requiredSlots(input).filter(s => input[s.side][s.idx]);
  if(!filled.length){ buzz(); return; }
  const last = filled[filled.length - 1];
  input[last.side][last.idx] = null;
  pruneInput();
  activeSlot = last;
  buzz();
  renderInput();
}

function renderInput(){
  ['p','b'].forEach(side => {
    const slots = document.getElementById(side + '-slots').querySelectorAll('.slot');
    slots.forEach((slot, i) => {
      const val = input[side][i];
      const skip = i === 2 && !val && thirdSkipped(side);
      slot.textContent = val || (skip ? '不補' : '');
      slot.className = 'slot' + (val ? ' filled' : '') + (skip ? ' skip' : '') +
        (activeSlot && activeSlot.side === side && activeSlot.idx === i ? ' active' : '');
    });
  });

  const pCards = cardsOf(input.p), bCards = cardsOf(input.b);
  document.getElementById('p-score').textContent = pCards.length >= 2 ? handValue(pCards) : '–';
  document.getElementById('b-score').textContent = bCards.length >= 2 ? handValue(bCards) : '–';

  const done = inputComplete();
  const tip = document.getElementById('tip');
  if(done){
    const w = getWinner(pCards, bCards);
    const wTxt = w === 'B' ? '莊贏' : w === 'P' ? '閒贏' : '和局';
    const pairs = [isPair(bCards) ? '莊對' : '', isPair(pCards) ? '閒對' : ''].filter(Boolean);
    tip.innerHTML = '<span class="res-' + w + '">' + wTxt + '</span>' +
      (pairs.length ? '　' + pairs.join('、') : '') + '　按 <b>記錄</b> 存檔';
  } else if(activeSlot){
    const who = activeSlot.side === 'p' ? '閒家' : '莊家';
    tip.innerHTML = '輸入 <b>' + who + '第 ' + (activeSlot.idx + 1) + ' 張</b>' +
      (activeSlot.idx === 2 ? '（補牌）' : '');
  }

  const pad = document.getElementById('keypad');
  pad.className = 'keypad ' + (done && !activeSlot ? 'done' : activeSlot ? activeSlot.side : '');
  document.getElementById('record').classList.toggle('ready', done);
}

function clearInput(){
  input = emptyInput();
  activeSlot = { side: 'p', idx: 0 };
  renderInput();
}

/* ========== 記錄 ========== */
function recordHand(){
  if(!editable()) return;
  if(!inputComplete()){
    const n = nextEmptySlot();
    alert('這手還沒輸入完：' + (n.side === 'p' ? '閒家' : '莊家') + '第 ' + (n.idx + 1) + ' 張');
    return;
  }
  const m = getActive();
  const pCards = cardsOf(input.p);
  const bCards = cardsOf(input.b);
  const err = validateNewCards(m, [...pCards, ...bCards]);
  if(err){ alert(err); return; }
  m.hands.push({ player: pCards, banker: bCards });
  state.lastModified = Date.now();
  buzz();
  clearInput();
  updateLastHint();
  render();
  schedulePush();
  const w = getWinner(pCards, bCards);
  showToast('已記錄 #' + m.hands.length + '　' + (w === 'B' ? '莊贏' : w === 'P' ? '閒贏' : '和局'), '撤銷', () => {
    // 只撤銷剛記的這一手（期間若又記了別手就不動）
    const mm = getActive();
    if(mm !== m || mm.hands.length === 0 || mm.hands[mm.hands.length - 1].player !== pCards) return;
    mm.hands.pop();
    state.lastModified = Date.now();
    updateLastHint();
    render();
    schedulePush();
    showToast('已撤銷 #' + (mm.hands.length + 1));
  });
}

let toastTimer = null;
function showToast(text, actLabel, onAct){
  const t = document.getElementById('toast');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = text;
  t.appendChild(span);
  if(actLabel){
    const b = document.createElement('button');
    b.textContent = actLabel;
    b.addEventListener('click', () => { t.classList.remove('on'); onAct(); });
    t.appendChild(b);
  }
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), actLabel ? 5000 : 2000);
}

document.getElementById('undo').addEventListener('click', function(){
  if(!editable()) return;
  const m = getActive();
  if(!m.hands.length) return;
  const last = m.hands[m.hands.length - 1];
  const desc = '閒 ' + last.player.map(c => c.rank).join(' ') + '　莊 ' + last.banker.map(c => c.rank).join(' ');
  if(!confirm('撤銷第 ' + m.hands.length + ' 局？\n' + desc)) return;
  m.hands.pop();
  state.lastModified = Date.now();
  updateLastHint();
  render();
  schedulePush();
});

/* ========== 右側浮動選單 ========== */
(function(){
  const fab = document.getElementById('fab'), menu = document.getElementById('fab-menu');
  const close = () => { menu.hidden = true; fab.setAttribute('aria-expanded', 'false'); fab.textContent = '☰'; };
  const open = () => {
    menu.hidden = false; fab.setAttribute('aria-expanded', 'true'); fab.textContent = '✕';
    const dockBtn = menu.querySelector('[data-act="dock"]');
    dockBtn.textContent = document.getElementById('dock').classList.contains('collapsed') ? '展開輸入區' : '收合輸入區';
  };
  fab.addEventListener('click', e => { e.stopPropagation(); menu.hidden ? open() : close(); });
  menu.addEventListener('click', e => {
    const a = e.target.closest('a');
    if(a){
      e.preventDefault();
      const target = document.querySelector(a.getAttribute('href'));
      if(target.dataset.sec) expandSection(target.dataset.sec);
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      close();
      return;
    }
    const act = e.target.closest('[data-act]');
    if(!act) return;
    if(act.dataset.act === 'top') window.scrollTo({ top: 0, behavior: 'smooth' });
    if(act.dataset.act === 'dock') document.getElementById('dock-toggle').click();
    if(act.dataset.act === 'newshoe') startNewShoe();
    close();
  });
  document.addEventListener('click', e => { if(!menu.hidden && !e.target.closest('#fab-wrap')) close(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') close(); });

  // 目前所在區塊（畫面上方最接近的那個）
  const links = [...menu.querySelectorAll('a')];
  const secs = links.map(a => document.querySelector(a.getAttribute('href')));
  let ticking = false;
  const spy = () => {
    ticking = false;
    const top = (parseFloat(getComputedStyle(document.body).getPropertyValue('--top-h')) || 100) + 20;
    let cur = -1, best = -Infinity, first = 0, firstTop = Infinity;
    secs.forEach((sec, i) => {
      const t = sec.getBoundingClientRect().top;
      if(t <= top && t > best){ best = t; cur = i; }
      if(t < firstTop){ firstTop = t; first = i; }
    });
    if(cur < 0) cur = first;
    links.forEach((a, i) => a.classList.toggle('cur', i === cur));
  };
  window.addEventListener('scroll', () => { if(!ticking){ ticking = true; requestAnimationFrame(spy); } }, { passive: true });
  spy();

  // 往下捲、機台區離開畫面後顯示細固定列；跳轉時以細列高度留白
  const topbar = document.querySelector('.topbar'), mini = document.getElementById('minibar');
  const syncTop = () => document.body.style.setProperty('--top-h', mini.offsetHeight + 'px');
  if(window.ResizeObserver) new ResizeObserver(syncTop).observe(mini);
  syncTop();
  const syncMini = () => mini.classList.toggle('on', topbar.getBoundingClientRect().bottom < 0);
  window.addEventListener('scroll', syncMini, { passive: true });
  syncMini();
  mini.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
})();

/* ========== 電腦鍵盤快速鍵 ==========
   A、2~9、0(=10)、J、Q、K 輸入；Backspace 刪上一張；Enter 記錄 */
document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'select' || tag === 'textarea') return;
  const k = e.key.toUpperCase();
  const map = { A: 'A', '1': 'A', '0': '10', T: '10', J: 'J', Q: 'Q', K: 'K' };
  let rank = map[k] || (/^[2-9]$/.test(k) ? k : null);
  if(rank){ e.preventDefault(); enterRank(rank); return; }
  if(e.key === 'Backspace'){ e.preventDefault(); backspace(); return; }
  if(e.key === 'Enter' && tag !== 'button'){ e.preventDefault(); recordHand(); }
});

/* 底部輸入區收合；內容區底部留白跟著輸入區高度走 */
document.getElementById('dock-toggle').addEventListener('click', function(){
  const dock = document.getElementById('dock');
  const collapsed = dock.classList.toggle('collapsed');
  this.textContent = collapsed ? '▴' : '▾';
  this.setAttribute('aria-label', collapsed ? '展開輸入區' : '收合輸入區');
});
(function(){
  const dock = document.getElementById('dock');
  const sync = () => document.body.style.setProperty('--dock-h', dock.offsetHeight + 'px');
  if(window.ResizeObserver) new ResizeObserver(sync).observe(dock);
  window.addEventListener('resize', sync);
  sync();
})();

document.getElementById('decks').addEventListener('change', function(){
  const m = getActive();
  if(!editable()){ this.value = m.decks; return; }
  const newDecks = parseInt(this.value, 10);
  if(newDecks < m.decks && m.hands.length){
    if(!confirm('減少副數可能導致已記錄的牌超出牌靴，確定要繼續？')){ this.value = m.decks; return; }
  }
  m.decks = newDecks;
  state.lastModified = Date.now();
  render();
  schedulePush();
});

['unit-bet', 'bonus-amt'].forEach(id => document.getElementById(id).addEventListener('change', function(){
  if(!ready()){ syncBonusInputs(); return; }
  const v = Math.max(id === 'unit-bet' ? 1 : 0, Math.round(+this.value || 0));
  getPrefs()[id === 'unit-bet' ? 'unitBet' : 'bonusAmt'] = v;
  lastBT = null; btCache = new WeakMap();           // 加送改變：重新回測
  state.lastModified = Date.now();
  syncBonusInputs();
  render();
  schedulePush();
}));

document.getElementById('rename-machine').addEventListener('click', function(){
  if(!editable()) return;
  const m = getActive();
  const name = prompt('新名稱：', m.name);
  if(name === null) return;
  m.name = name.trim() || m.name;
  state.lastModified = Date.now();
  renderMachineBar();
  schedulePush();
});

document.getElementById('delete-machine').addEventListener('click', function(){
  if(!editable()) return;
  if(state.machines.length <= 1){ alert('至少需要保留一個機台'); return; }
  const m = getActive();
  if(!confirm('刪除「' + m.name + '」？此動作無法復原。')) return;
  state.machines = state.machines.filter(x => x.id !== m.id);
  state.activeId = state.machines[0].id;
  state.lastModified = Date.now();
  document.getElementById('decks').value = getActive().decks;
  clearInput();
  updateLastHint();
  render();
  schedulePush();
});

document.getElementById('force-pull').addEventListener('click', function(){
  if(!isConfigured){ alert('尚未設定 Firebase'); return; }
  if(dirty && !confirm('有尚未上傳的修改，重新載入會捨棄，確定嗎？')) return;
  if(pushTimer){ clearTimeout(pushTimer); pushTimer = null; }
  dirty = false;
  loaded = false;
  setStatus('重新載入中…', 'syncing');
  pullAndMerge(false);
});

/* 清空雲端 */
document.getElementById('clear-cloud').addEventListener('click', function(){
  if(!isConfigured){ alert('尚未設定 Firebase'); return; }
  if(!confirm('⚠️ 將清空雲端上的所有資料！\n\n所有機台與紀錄都會消失。\n\n確定要繼續嗎？')) return;
  if(!confirm('再次確認：雲端資料將永久刪除，無法復原。')) return;

  setStatus('清空中…', 'syncing');
  if(pushTimer){ clearTimeout(pushTimer); pushTimer = null; }
  dirty = false;
  cloudDelete().then(() => {
    lastPushAt = 0;
    lastSynced = null;
    adoptState({ machines: [], activeId: null, lastModified: 0 });
    clearInput();
    refreshAll();
    setStatus('✓ 雲端已清空 ' + new Date().toLocaleTimeString('zh-TW', {hour12:false}), 'on');
  }).catch(e => {
    setStatus('清空失敗：' + e.message, 'err');
  });
});

document.getElementById('export-btn').addEventListener('click', function(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const t = new Date();
  const stamp = t.getFullYear() + String(t.getMonth()+1).padStart(2,'0') +
                String(t.getDate()).padStart(2,'0') + '_' +
                String(t.getHours()).padStart(2,'0') + String(t.getMinutes()).padStart(2,'0');
  a.href = url; a.download = 'baccarat_' + stamp + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('import-btn').addEventListener('click', function(){
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', function(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!ready()){ e.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const d = JSON.parse(ev.target.result);
      if(!d || !Array.isArray(d.machines)) throw new Error('格式不正確');
      if(!confirm('匯入將覆蓋雲端上所有機台，確定嗎？')) return;
      state.activeId = null;
      adoptState(d);
      lastSynced = null;                              // 匯入：整份覆蓋雲端
      state.lastModified = Date.now();
      clearInput();
      refreshAll();
      schedulePush();
    }catch(err){ alert('匯入失敗：' + err.message); }
    e.target.value = '';
  };
  reader.readAsText(file);
});

document.addEventListener('visibilitychange', function(){
  if(!document.hidden && isConfigured) pullAndMerge(true);
});

/* 初始化 */
ensureDefaultMachine();
document.getElementById('decks').value = getActive().decks;
buildSlots();
buildKeypad();
clearInput();
syncBonusInputs();
updateLastHint();
render();

if(!isConfigured){
  setStatus('⚠ 尚未設定 Firebase', 'err');
} else {
  setStatus('連線中…', 'syncing');
  pullAndMerge(false).then(() => startPolling());
}

})();
</script>
